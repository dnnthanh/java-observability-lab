name: Restore source tree

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/restore-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bootstrap repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnose bootstrap archive
        shell: bash
        run: |
          set -euo pipefail
          test -d .repo-import
          count=$(find .repo-import -maxdepth 1 -type f -name 'part-*' | wc -l)
          echo "archive parts: $count"
          test "$count" -eq 9
          for f in $(find .repo-import -maxdepth 1 -type f -name 'part-*' | sort); do
            echo "$(basename "$f") bytes=$(wc -c < "$f")"
          done
          python3 - <<'PY'
          from pathlib import Path
          import base64
          files = sorted(Path('.repo-import').glob('part-*'))
          chunks = []
          offset = 0
          for p in files:
              raw = p.read_text()
              bad = [(i, repr(ch)) for i, ch in enumerate(raw) if ch not in 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/=\r\n']
              eq = [i for i, ch in enumerate(raw) if ch == '=']
              print(f'{p.name}: chars={len(raw)} mod4={len(raw)%4} equals={eq[:8]} bad={bad[:8]}')
              chunks.append(raw)
          s = ''.join(chunks)
          compact = ''.join(s.split())
          print(f'combined chars={len(s)} compact={len(compact)} mod4={len(compact)%4}')
          first_eq = compact.find('=')
          print(f'first_equals={first_eq}; tail_after_first_equals={len(compact)-first_eq-1 if first_eq >= 0 else -1}')
          try:
              decoded = base64.b64decode(compact, validate=True)
              print(f'base64 validation: PASS decoded_bytes={len(decoded)}')
          except Exception as exc:
              print(f'base64 validation: FAIL {type(exc).__name__}: {exc}')
              raise
          Path('/tmp/java-observability-lab.tar.gz').write_bytes(decoded)
          PY

      - name: Validate gzip and archive layout
        shell: bash
        run: |
          set -euo pipefail
          gzip -t /tmp/java-observability-lab.tar.gz
          echo "gzip integrity: PASS"
          echo "archive entries: $(tar -tzf /tmp/java-observability-lab.tar.gz | wc -l)"
          tar -tzf /tmp/java-observability-lab.tar.gz | sed -n '1,60p'

      - name: Extract source safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/restored
          mkdir -p /tmp/restored
          tar -xzf /tmp/java-observability-lab.tar.gz -C /tmp/restored
          echo "restored file count: $(find /tmp/restored -type f | wc -l)"
          find /tmp/restored -mindepth 1 -maxdepth 2 -print | sort | sed -n '1,100p'
          test "$(find /tmp/restored -type f | wc -l)" -ge 100
          test -f /tmp/restored/pom.xml
          test -f /tmp/restored/README.md
          test -d /tmp/restored/services
          test -d /tmp/restored/deploy
          test -d /tmp/restored/incidents

      - name: Materialize repository source tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/restored/. .
          test -f pom.xml
          test -f README.md
          test -d services
          test -d deploy
          test -d incidents
          echo "materialized file count: $(find . -path ./.git -prune -o -type f -print | wc -l)"

      - name: Commit restored source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short | sed -n '1,240p'
          git commit -m 'feat: materialize java observability lab source'
          git push origin HEAD:master
