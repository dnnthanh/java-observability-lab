apiVersion: v1
kind: ConfigMap
metadata: {name: logstash-config, namespace: observability}
data:
  logstash.conf: |
    input { beats { port => 5044 } }
    output {
      elasticsearch {
        hosts => ["http://elasticsearch:9200"]
        index => "lab-logs-%{+YYYY.MM.dd}"
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata: {name: filebeat-config, namespace: observability}
data:
  filebeat.yml: |
    filebeat.inputs:
      - type: filestream
        id: lab-kubernetes-containers
        enabled: true
        prospector.scanner.symlinks: true
        close.on_state_change.removed: false
        paths:
          - /var/log/containers/*_lab_*.log
        parsers:
          - container: ~
        processors:
          - add_kubernetes_metadata:
              host: ${NODE_NAME}
              matchers:
                - logs_path:
                    logs_path: "/var/log/containers/"
    output.logstash:
      hosts: ["logstash:5044"]
    logging.level: info
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: elasticsearch, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: elasticsearch}}
  template:
    metadata: {labels: {app: elasticsearch}}
    spec:
      containers:
        - name: elasticsearch
          image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
          env:
            - {name: discovery.type, value: single-node}
            - {name: xpack.security.enabled, value: "false"}
            - {name: ES_JAVA_OPTS, value: "-Xms512m -Xmx512m"}
          ports: [{containerPort: 9200}]
          readinessProbe:
            httpGet: {path: /_cluster/health, port: 9200}
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: {cpu: 100m, memory: 768Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata: {name: elasticsearch, namespace: observability}
spec:
  selector: {app: elasticsearch}
  ports: [{port: 9200, targetPort: 9200}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: logstash, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: logstash}}
  template:
    metadata: {labels: {app: logstash}}
    spec:
      containers:
        - name: logstash
          image: docker.elastic.co/logstash/logstash:9.5.3
          env: [{name: LS_JAVA_OPTS, value: "-Xms256m -Xmx256m"}]
          ports: [{containerPort: 5044}]
          readinessProbe:
            tcpSocket: {port: 5044}
            initialDelaySeconds: 20
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {cpu: 500m, memory: 768Mi}
          volumeMounts: [{name: config, mountPath: /usr/share/logstash/pipeline}]
      volumes: [{name: config, configMap: {name: logstash-config}}]
---
apiVersion: v1
kind: Service
metadata: {name: logstash, namespace: observability}
spec:
  selector: {app: logstash}
  ports: [{port: 5044, targetPort: 5044}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kibana, namespace: observability}
spec:
  replicas: 1
  selector: {matchLabels: {app: kibana}}
  template:
    metadata: {labels: {app: kibana}}
    spec:
      containers:
        - name: kibana
          image: docker.elastic.co/kibana/kibana:9.5.3
          env: [{name: ELASTICSEARCH_HOSTS, value: "http://elasticsearch:9200"}]
          ports: [{containerPort: 5601}]
          readinessProbe:
            httpGet: {path: /api/status, port: 5601}
            initialDelaySeconds: 30
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: {cpu: 50m, memory: 384Mi}
            limits: {cpu: "1", memory: 768Mi}
---
apiVersion: v1
kind: Service
metadata: {name: kibana, namespace: observability}
spec:
  type: NodePort
  selector: {app: kibana}
  ports: [{port: 5601, targetPort: 5601, nodePort: 30561}]
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: filebeat, namespace: observability}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: filebeat-lab}
rules:
  - apiGroups: [""]
    resources: ["pods","namespaces","nodes"]
    verbs: ["get","list","watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: filebeat-lab}
subjects:
  - {kind: ServiceAccount, name: filebeat, namespace: observability}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: filebeat-lab}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: filebeat, namespace: observability}
spec:
  selector: {matchLabels: {app: filebeat}}
  template:
    metadata: {labels: {app: filebeat}}
    spec:
      serviceAccountName: filebeat
      containers:
        - name: filebeat
          image: docker.elastic.co/beats/filebeat:9.5.3
          args: ["-e", "-c", "/usr/share/filebeat/filebeat.yml", "--strict.perms=false"]
          env:
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          securityContext: {runAsUser: 0}
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: config, mountPath: /usr/share/filebeat/filebeat.yml, subPath: filebeat.yml, readOnly: true}
            - {name: varlogcontainers, mountPath: /var/log/containers, readOnly: true}
            - {name: varlogpods, mountPath: /var/log/pods, readOnly: true}
            - {name: data, mountPath: /usr/share/filebeat/data}
      volumes:
        - {name: config, configMap: {name: filebeat-config}}
        - {name: varlogcontainers, hostPath: {path: /var/log/containers}}
        - {name: varlogpods, hostPath: {path: /var/log/pods}}
        - {name: data, emptyDir: {}}
