apiVersion: v1
kind: ConfigMap
metadata:
  name: java-observability-dashboard
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  java-observability.json: |
    {
      "title": "Java Observability Lab - Kubernetes & App",
      "uid": "java-observability-lab",
      "schemaVersion": 39,
      "version": 1,
      "time": {"from":"now-30m","to":"now"},
      "panels": [
        {"type":"stat","title":"Ready Pods","gridPos":{"x":0,"y":0,"w":6,"h":4},
         "targets":[{"expr":"sum(kube_pod_status_ready{namespace=\"lab\",condition=\"true\"})","refId":"A"}]},
        {"type":"timeseries","title":"Pod Restarts","gridPos":{"x":6,"y":0,"w":9,"h":8},
         "targets":[{"expr":"sum by (pod) (kube_pod_container_status_restarts_total{namespace=\"lab\"})","refId":"A"}]},
        {"type":"timeseries","title":"HTTP Request Rate","gridPos":{"x":15,"y":0,"w":9,"h":8},
         "targets":[{"expr":"sum by (service) (rate(http_server_requests_seconds_count[1m]))","refId":"A"}]},
        {"type":"timeseries","title":"HTTP p95","gridPos":{"x":0,"y":8,"w":12,"h":8},
         "targets":[{"expr":"histogram_quantile(0.95, sum by (le,service) (rate(http_server_requests_seconds_bucket[5m])))","refId":"A"}]},
        {"type":"timeseries","title":"JVM Heap","gridPos":{"x":12,"y":8,"w":12,"h":8},
         "targets":[{"expr":"sum by (pod) (jvm_memory_used_bytes{area=\"heap\"})","refId":"A"}]}
      ]
    }
