apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-service
  namespace: lab
spec:
  replicas: 2
  selector: {matchLabels: {app: edge-service}}
  template:
    metadata:
      labels: {app: edge-service, app.kubernetes.io/part-of: java-observability-lab}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: lab/edge-service:local
          imagePullPolicy: Never
          ports: [{containerPort: 8080, name: http}]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - {name: ORDER_URL, value: "http://order-service:8080"}
          startupProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: 8080}
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: 8080}
            periodSeconds: 10
            failureThreshold: 3
          lifecycle:
            preStop: {exec: {command: ["sh","-c","sleep 5"]}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata: {name: edge-service, namespace: lab}
spec:
  type: NodePort
  selector: {app: edge-service}
  ports: [{name: http, port: 8080, targetPort: 8080, nodePort: 30080}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: order-service, namespace: lab}
spec:
  replicas: 3
  selector: {matchLabels: {app: order-service}}
  template:
    metadata:
      labels: {app: order-service, app.kubernetes.io/part-of: java-observability-lab}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: lab/order-service:local
          imagePullPolicy: Never
          ports: [{containerPort: 8080, name: http}]
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - {name: DB_URL, value: "jdbc:postgresql://postgres:5432/lab"}
            - {name: DB_USER, value: lab}
            - {name: DB_PASSWORD, value: lab}
            - {name: KAFKA_BOOTSTRAP, value: "kafka:9092"}
            - {name: INVENTORY_URL, value: "http://inventory-service:8080"}
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, failureThreshold: 30, periodSeconds: 2}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: 8080}, periodSeconds: 5, failureThreshold: 2}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: 8080}, periodSeconds: 10, failureThreshold: 3}
          lifecycle: {preStop: {exec: {command: ["sh","-c","sleep 5"]}}}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 384Mi}
---
apiVersion: v1
kind: Service
metadata: {name: order-service, namespace: lab}
spec:
  selector: {app: order-service}
  ports: [{name: http, port: 8080, targetPort: 8080}]
---
